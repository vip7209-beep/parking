<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>뽀띠찾기</title>

<!-- PWA 메타태그 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#090d16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">

<style>
  :root {
    --bg-dark: #090d16;
    --card-dark: #131b2e;
    --card-border: #1e293b;
    --accent-blue: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.4);
    --zone-a: #f87171;
    --zone-b: #4ade80;
    --zone-c: #facc15;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0; padding: 0;
    background-color: var(--bg-dark);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
    color: var(--text-main);
    display: flex; justify-content: center;
  }

  .mobile-container {
    width: 100%; max-width: 440px; min-height: 100vh;
    display: flex; flex-direction: column;
    padding: 16px; padding-bottom: 36px;
  }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 4px 12px;
  }
  .header-left h1 { font-size: 19px; font-weight: 700; margin: 0 0 4px 0; letter-spacing: -0.4px; }
  .header-left p { font-size: 12px; color: var(--text-muted); margin: 0; }
  .refresh-btn {
    background: var(--card-dark); border: 1px solid var(--card-border);
    color: var(--text-muted); font-size: 13px; padding: 8px 12px;
    border-radius: 10px; cursor: pointer;
  }

  .floor-toggle {
    display: flex; background: var(--card-dark); padding: 4px;
    border-radius: 12px; border: 1px solid var(--card-border);
    margin-bottom: 12px;
  }
  .floor-tab {
    flex: 1; text-align: center; padding: 10px 0; font-size: 15px; font-weight: 700;
    color: var(--text-muted); border-radius: 8px; cursor: pointer; transition: all 0.2s;
  }
  .floor-tab.active { background: #2563eb; color: white; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4); }

  .recommend-badge {
    background: rgba(56, 189, 248, 0.12); border: 1px solid #0284c7;
    border-radius: 12px; padding: 9px 12px; font-size: 12px; font-weight: 700;
    color: var(--accent-blue); margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
  }

  .map-card {
    background: #0d1322; border: 1.5px solid var(--card-border);
    border-radius: 20px; padding: 14px 10px; position: relative;
  }
  .map-caption { text-align: center; font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }

  svg text { user-select: none; }
  .zone-interactive { cursor: pointer; transition: all 0.2s ease; }
  .zone-interactive:hover { filter: brightness(1.2); }
  .zone-interactive.active rect {
    stroke-width: 3px; stroke: var(--accent-blue) !important;
    fill: rgba(56, 189, 248, 0.16) !important;
    filter: drop-shadow(0 0 10px var(--accent-glow));
  }

  /* 주차 상태 카드 */
  .status-card {
    background: var(--card-dark); border: 1px solid var(--card-border);
    border-radius: 18px; padding: 18px; margin-top: 14px;
  }
  .status-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .status-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .status-badge-user {
    background: #1e293b; border: 1px solid #334155; padding: 3px 9px;
    border-radius: 6px; font-size: 11.5px; font-weight: 600; color: #e2e8f0;
  }
  .status-main-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    border-bottom: 1px solid var(--card-border); padding-bottom: 14px; margin-bottom: 12px;
  }
  .floor-badge {
    background: #2563eb; color: #ffffff; font-size: 13px; font-weight: 800;
    padding: 4px 9px; border-radius: 8px; flex-shrink: 0;
  }
  .status-pos-text { font-size: 18px; font-weight: 800; color: #ffffff; word-break: break-all; flex: 1; }

  .status-details-grid { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--text-muted); margin-bottom: 10px; }
  .status-detail-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .status-detail-item strong { color: #f1f5f9; font-weight: 600; }

  .photo-preview-wrap {
    margin-top: 10px; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--card-border); display: none; cursor: pointer; position: relative;
  }
  .photo-preview-wrap img { width: 100%; max-height: 220px; object-fit: cover; display: block; }
  .photo-preview-wrap::after {
    content: "🔍 터치하여 원본 사진 확대"; position: absolute; bottom: 6px; right: 8px;
    background: rgba(0,0,0,0.6); color: #fff; font-size: 10px; padding: 3px 6px; border-radius: 4px;
  }

  .kakao-share-btn {
    width: 100%; padding: 13px; background: #fee500; color: #191919;
    border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
    display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px;
  }
  .primary-action-btn {
    width: 100%; padding: 14px; background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border: none; border-radius: 12px; color: white; font-size: 15px; font-weight: 700;
    cursor: pointer; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); margin-top: 8px;
  }

  /* 팝업 모달 공통 */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
    z-index: 1000; justify-content: center; align-items: flex-end;
  }
  .modal-content {
    background: #131b2e; border: 1px solid #334155; border-radius: 24px 24px 0 0;
    width: 100%; max-width: 440px; padding: 18px; box-sizing: border-box;
    animation: modalSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    max-height: 92vh; overflow-y: auto;
  }
  @keyframes modalSlide { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .modal-header h3 { margin: 0; font-size: 17px; }
  .modal-close { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }

  /* 팝업 내 반응형 SVG 뷰포트 */
  .detail-popup-scroll {
    width: 100%; max-height: 60vh; overflow: auto;
    background: #090d16; border-radius: 12px; border: 1px solid #1e293b;
    touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch;
  }
  .spot-node { cursor: pointer; }
  .spot-node.car-parked rect {
    fill: #2563eb !important; stroke: #38bdf8 !important; stroke-width: 3px !important;
  }

  .text-input {
    width: 100%; background: #090d16; border: 1.5px solid #334155;
    border-radius: 12px; padding: 14px; font-size: 16px; color: #fff; outline: none; margin-bottom: 12px;
  }
  .camera-btn {
    width: 100%; background: #090d16; border: 1.5px dashed #475569;
    border-radius: 12px; padding: 14px; color: var(--text-muted); font-size: 14px;
    font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;
  }
  .camera-btn.has-photo { border-color: #22c55e; color: #4ade80; }
  .modal-photo-preview {
    margin-top: 10px; width: 100%; height: 140px; border-radius: 10px;
    object-fit: cover; display: none; border: 1px solid #334155;
  }
  .user-toggle { display: flex; gap: 10px; margin-bottom: 14px; }
  .user-btn {
    flex: 1; background: #090d16; border: 1px solid #334155; color: #94a3b8;
    padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .user-btn.active { background: #1e293b; color: white; border-color: #64748b; }
  .submit-btn {
    width: 100%; padding: 14px; background: #22c55e; border: none;
    border-radius: 12px; color: white; font-size: 16px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>

<div class="mobile-container">
  <div class="header">
    <div class="header-left">
      <h1>뽀띠찾기 · 110동</h1>
      <p>남주길 150 · 스마트 주차 위치 공유</p>
    </div>
    <button class="refresh-btn" onclick="fetchParkingData()">🔄 새로고침</button>
  </div>

  <div class="floor-toggle">
    <div class="floor-tab active" id="tab-B2" onclick="switchFloor('지하 2층')">지하 2층 (B2)</div>
    <div class="floor-tab" id="tab-B3" onclick="switchFloor('지하 3층')">지하 3층 (B3)</div>
  </div>

  <div class="recommend-badge" id="recommendBadge">
    <span>💡</span> <span id="recommendText">등록된 주차 위치를 확인 중입니다...</span>
  </div>

  <!-- 메인 안내도 -->
  <div class="map-card">
    <div class="map-caption">💡 구역(A, B, C)을 터치하면 상세 지도가 팝업으로 열립니다</div>
    <svg viewBox="0 0 400 320" style="width: 100%; height: auto; display: block;">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
        </marker>
        <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
        </filter>
      </defs>

      <rect x="10" y="10" width="380" height="300" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="2" />

      <!-- A 구역 -->
      <g id="svg-zone-A" class="zone-interactive" onclick="openZonePopup('A')">
        <rect x="85" y="24" width="165" height="78" rx="10" fill="rgba(239, 68, 68, 0.08)" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 3" />
        <text x="167" y="55" fill="#f87171" font-size="20" font-weight="900" text-anchor="middle">A 구역 🔍</text>
        <text x="167" y="75" fill="#94a3b8" font-size="10.5" text-anchor="middle">1호 EV 정면 직진</text>
      </g>

      <!-- B 구역 -->
      <g id="svg-zone-B" class="zone-interactive" onclick="openZonePopup('B')">
        <rect x="36" y="145" width="118" height="145" rx="10" fill="rgba(34, 197, 94, 0.08)" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 3" />
        <text x="95" y="205" fill="#4ade80" font-size="20" font-weight="900" text-anchor="middle">B 구역 🔍</text>
        <text x="95" y="228" fill="#94a3b8" font-size="11" text-anchor="middle">택배보관함 방향</text>
      </g>

      <!-- C 구역 -->
      <g id="svg-zone-C" class="zone-interactive" onclick="openZonePopup('C')">
        <rect x="252" y="90" width="124" height="195" rx="10" fill="rgba(234, 179, 8, 0.08)" stroke="#eab308" stroke-width="2" stroke-dasharray="5 3" />
        <text x="314" y="175" fill="#facc15" font-size="20" font-weight="900" text-anchor="middle">C 구역 🔍</text>
        <text x="314" y="198" fill="#94a3b8" font-size="11" text-anchor="middle">EV 우측방향</text>
      </g>

      <!-- 중앙 복도 -->
      <polygon points="160,110 185,110 185,155 235,155 235,180 160,180" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <line x1="172" y1="170" x2="172" y2="120" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />
      <line x1="175" y1="168" x2="225" y2="168" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />

      <g transform="translate(160, 185)">
        <rect x="0" y="0" width="34" height="30" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6" />
        <text x="17" y="19" fill="#38bdf8" font-size="8.5" font-weight="bold" text-anchor="middle">1호 EV</text>
        <rect x="40" y="0" width="34" height="30" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6" />
        <text x="57" y="19" fill="#38bdf8" font-size="8.5" font-weight="bold" text-anchor="middle">2호 EV</text>
        <text x="37" y="42" fill="#cbd5e1" font-size="9" font-weight="bold" text-anchor="middle">110동 EV 홀</text>
      </g>

      <g transform="translate(105, 116)">
        <rect x="0" y="0" width="10" height="10" rx="2" fill="#ef4444" />
        <text x="15" y="9" fill="#f87171" font-size="9.5" font-weight="bold">무인택배함</text>
      </g>

      <g id="svg-car-marker" style="display: none;">
        <circle cx="0" cy="0" r="16" fill="#2563eb" stroke="#38bdf8" stroke-width="2" filter="url(#glow-badge)" />
        <text x="0" y="5" font-size="14" text-anchor="middle">🚗</text>
      </g>
    </svg>
  </div>

  <!-- 주차 상태 카드 -->
  <div class="status-card">
    <div class="status-label-row">
      <span class="status-label">현재 주차된 위치</span>
      <span class="status-badge-user" id="display-user">등록자: -</span>
    </div>

    <div class="status-main-row">
      <span class="floor-badge" id="display-floor-badge">B2</span>
      <div class="status-pos-text" id="display-pos">-</div>
    </div>

    <div class="status-details-grid">
      <div class="status-detail-item">
        <span>빠른 출구</span>
        <strong id="display-exit">-</strong>
      </div>
      <div class="status-detail-item">
        <span>업데이트</span>
        <strong id="display-time">-</strong>
      </div>
    </div>

    <div class="photo-preview-wrap" id="mainPhotoWrap" onclick="openLightbox()">
      <img id="mainPhotoImg" src="" alt="주차 위치 사진">
    </div>

    <button class="kakao-share-btn" onclick="shareToKakao()">
      💬 카카오톡으로 주차 위치 보내기
    </button>

    <button class="primary-action-btn" onclick="openRegisterModal(currentZone || 'A')">
      🚗 주차 위치 새로 등록 / 변경하기
    </button>
  </div>
</div>

<!-- 1. 구역별 상세 평면도 팝업 모달 (모바일 최적화) -->
<div id="zoneDetailModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="popupZoneTitle">A 구역 상세 평면도</h3>
      <button class="modal-close" onclick="closeZonePopup()">✕</button>
    </div>
    <div style="font-size:11.5px; color:var(--text-muted); margin-bottom:8px;">
      💡 주차한 칸을 터치하면 바로 등록됩니다 (좌우로 스크롤 가능)
    </div>
    
    <div class="detail-popup-scroll">
      <svg id="popupDetailSvg" style="display: block;">
        <g id="popupElementsGroup"></g>
      </svg>
    </div>
  </div>
</div>

<!-- 2. 주차 정보 수동 등록 모달 -->
<div id="registerModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalZoneTitle">주차 위치 등록</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="picker-section-title" style="font-size:13px; font-weight:700; color:var(--text-muted); margin-bottom:8px;">구역 선택</div>
    <div style="display: flex; gap: 8px; margin-bottom:12px;">
      <button class="user-btn" id="btn-zone-A" onclick="changeModalZone('A')">A구역</button>
      <button class="user-btn" id="btn-zone-B" onclick="changeModalZone('B')">B구역</button>
      <button class="user-btn" id="btn-zone-C" onclick="changeModalZone('C')">C구역</button>
    </div>

    <div class="picker-section-title" style="font-size:13px; font-weight:700; color:var(--text-muted); margin-bottom:8px;">기둥/칸 번호 입력</div>
    <input type="text" id="inputPillar" class="text-input" placeholder="예: Q11, R10, M14, 택배함앞">

    <div class="picker-section-title" style="font-size:13px; font-weight:700; color:var(--text-muted); margin-bottom:8px;">주차 사진 첨부 (선택)</div>
    <label class="camera-btn" id="cameraBtnLabel">
      <span>📷</span> <span id="cameraBtnText">사진 촬영 또는 앨범에서 선택</span>
      <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display: none;" onchange="handlePhotoUpload(this)">
    </label>
    <img id="modalPhotoPreview" class="modal-photo-preview" src="">

    <div class="picker-section-title" style="font-size:13px; font-weight:700; color:var(--text-muted); margin:14px 0 8px;">주차자</div>
    <div class="user-toggle">
      <button class="user-btn active" id="user-btn-me" onclick="selectUser('남편')">남편</button>
      <button class="user-btn" id="user-btn-wife" onclick="selectUser('와이프')">와이프</button>
    </div>

    <button id="saveSubmitBtn" class="submit-btn" onclick="submitParkingData()">
      주차 위치 저장하기
    </button>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxRDQ4C9HC47rSSgaKpfON4WfP2vI0gymwcVCd2dn_CtaOBsDJHkSwCDgNWIJpUckLEwQ/exec";

  const zoneExitGuides = {
    "A": "1호 EV 정면 직진 출구",
    "B": "110동 좌측길 ➔ 택배보관함 방향",
    "C": "2호 EV 우측 출구 ➔ EV 우측방향"
  };

  const zoneEvRecommendation = {
    "A": "귀가 추천: [1호 EV] 탑승 시 가장 빠릅니다 (도보 10m)",
    "B": "귀가 추천: [1호 EV] 탑승 후 무인택배함 쪽 통로 이용",
    "C": "귀가 추천: [2호 EV] 탑승 후 우측 복도로 나가세요"
  };

  const zoneMarkerPositions = {
    "A": { x: 220, y: 44 },
    "B": { x: 130, y: 165 },
    "C": { x: 350, y: 110 }
  };

  let activePopupZone = "A";
  let mapData = { "A": [], "B": [], "C": [] };

  let currentFloor = "지하 2층";
  let currentZone = "A";
  let currentPillar = "";
  let selectedUser = "남편";
  let currentBase64Photo = "";

  window.onload = function() {
    loadCloudMapConfig();
    fetchParkingData();
  };

  function loadCloudMapConfig() {
    fetch(GAS_URL + "?action=getMapConfig")
      .then(res => res.json())
      .then(data => {
        if (data.success && data.config) {
          mapData = data.config;
        }
      })
      .catch(err => console.warn(err));
  }

  // --- 구역 탭 시 모달 팝업 오픈 (자동 화면 최적화) ---
  function openZonePopup(zone) {
    activePopupZone = zone;
    document.getElementById("popupZoneTitle").innerText = `${zone} 구역 상세 평면도`;
    renderPopupElements(zone);
    document.getElementById("zoneDetailModal").style.display = "flex";
  }

  function closeZonePopup() {
    document.getElementById("zoneDetailModal").style.display = "none";
  }

  // 모바일 화면 크기에 맞게 SVG viewBox를 타이트하게 자동 계산 (Auto-Crop)
  function renderPopupElements(zone) {
    const group = document.getElementById("popupElementsGroup");
    const svg = document.getElementById("popupDetailSvg");
    group.innerHTML = "";

    const items = mapData[zone] || [];
    if (items.length === 0) {
      group.innerHTML = `<text x="150" y="100" fill="#94a3b8" font-size="14" text-anchor="middle">등록된 도면이 없습니다. (PC에서 편집 필요)</text>`;
      svg.setAttribute("viewBox", "0 0 300 200");
      svg.setAttribute("width", "300");
      svg.setAttribute("height", "200");
      return;
    }

    // 배치된 요소들의 최소/최대 좌표를 구해 여백 없이 viewBox 설정
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    items.forEach(it => {
      minX = Math.min(minX, it.x);
      minY = Math.min(minY, it.y);
      maxX = Math.max(maxX, it.x + (it.w || 40));
      maxY = Math.max(maxY, it.y + (it.h || 40));
    });

    const pad = 25;
    minX = Math.max(0, minX - pad);
    minY = Math.max(0, minY - pad);
    const boxW = Math.max(300, (maxX - minX) + pad * 2);
    const boxH = Math.max(200, (maxY - minY) + pad * 2);

    svg.setAttribute("viewBox", `${minX} ${minY} ${boxW} ${boxH}`);
    svg.setAttribute("width", boxW);
    svg.setAttribute("height", boxH);

    // 요소들 렌더링
    items.forEach(it => {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const isCar = (currentZone === zone && currentPillar === it.name && it.type === "spot");

      g.setAttribute("class", `spot-node ${isCar ? 'car-parked' : ''}`);
      g.setAttribute("transform", `translate(${it.x}, ${it.y})`);

      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("width", it.w);
      rect.setAttribute("height", it.h);
      rect.setAttribute("rx", it.type === "wall" ? "1" : "4");

      if (it.type === "spot") {
        rect.setAttribute("fill", isCar ? "#2563eb" : "rgba(30, 41, 59, 0.7)");
        rect.setAttribute("stroke", isCar ? "#38bdf8" : (zone === "A" ? "#ef4444" : (zone === "B" ? "#22c55e" : "#eab308")));
        rect.setAttribute("stroke-width", isCar ? "3" : "1.5");
      } else if (it.type === "machinery") {
        rect.setAttribute("fill", "#1e293b"); rect.setAttribute("stroke", "#475569"); rect.setAttribute("stroke-width", "2");
      } else if (it.type === "ev_hall" || it.type === "ev_box") {
        rect.setAttribute("fill", "#1e293b"); rect.setAttribute("stroke", "#38bdf8"); rect.setAttribute("stroke-width", "1.8");
      } else if (it.type === "exit") {
        rect.setAttribute("fill", "rgba(56, 189, 248, 0.1)"); rect.setAttribute("stroke", "#38bdf8"); rect.setAttribute("stroke-width", "1.2"); rect.setAttribute("stroke-dasharray", "3 2");
      } else if (it.type === "wall") {
        rect.setAttribute("fill", "#64748b"); rect.setAttribute("stroke", "#475569"); rect.setAttribute("stroke-width", "1");
      }

      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", it.w / 2);
      text.setAttribute("y", it.h / 2 + 4);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("font-size", isCar ? "14" : (it.type === "machinery" ? "13" : "11"));
      text.setAttribute("font-weight", "bold");
      text.setAttribute("fill", isCar ? "#fff" : (it.type === "spot" ? "#fca5a5" : "#e2e8f0"));
      text.textContent = isCar ? "🚗" : it.name;

      g.appendChild(rect);
      g.appendChild(text);

      if (it.type === "spot") {
        g.onclick = () => {
          closeZonePopup();
          quickParkAtSpot(zone, it.name);
        };
      }
      group.appendChild(g);
    });
  }

  function quickParkAtSpot(zone, spotName) {
    if (confirm(`${zone}구역 [${spotName}]에 주차를 등록하시겠습니까?`)) {
      const payload = {
        floor: currentFloor,
        zone: zone,
        pillar: spotName,
        updatedBy: selectedUser,
        photo: ""
      };
      saveToGas(payload);
    }
  }

  function fetchParkingData() {
    fetch(GAS_URL)
      .then(res => res.json())
      .then(data => renderParkingStatus(data))
      .catch(err => console.error("데이터 조회 에러:", err));
  }

  function renderParkingStatus(data) {
    if (!data) return;

    currentFloor = data.floor || "지하 2층";
    currentZone = data.zone || "A";
    currentPillar = data.pillar || "";

    switchFloor(currentFloor);

    const floorShort = currentFloor.includes("3") ? "B3" : "B2";
    const badgeEl = document.getElementById("display-floor-badge");
    if (badgeEl) badgeEl.innerText = floorShort;

    const posEl = document.getElementById("display-pos");
    if (posEl) posEl.innerText = (data.zone && data.pillar) ? `${data.zone}구역 · ${data.pillar}` : "미등록";

    const userEl = document.getElementById("display-user");
    if (userEl) userEl.innerText = "등록자: " + (data.updatedBy || "-");

    const exitEl = document.getElementById("display-exit");
    if (exitEl) exitEl.innerText = zoneExitGuides[data.zone] || "-";

    const timeEl = document.getElementById("display-time");
    if (timeEl) timeEl.innerText = data.updatedAt || "-";

    const recText = zoneEvRecommendation[data.zone] || "귀가 시 편한 엘리베이터를 이용하세요.";
    const recEl = document.getElementById("recommendText");
    if (recEl) recEl.innerText = recText;

    const photoWrap = document.getElementById("mainPhotoWrap");
    const photoImg = document.getElementById("mainPhotoImg");
    if (data.photo && data.photo.length > 30) {
      photoImg.src = data.photo;
      photoWrap.style.display = "block";
    } else {
      photoWrap.style.display = "none";
    }

    document.querySelectorAll(".zone-interactive").forEach(el => el.classList.remove("active"));
    const marker = document.getElementById("svg-car-marker");

    if (data.zone && zoneMarkerPositions[data.zone]) {
      const targetZone = document.getElementById("svg-zone-" + data.zone);
      if (targetZone) targetZone.classList.add("active");

      const pos = zoneMarkerPositions[data.zone];
      marker.setAttribute("transform", `translate(${pos.x}, ${pos.y})`);
      marker.style.display = "block";
    } else {
      marker.style.display = "none";
    }
  }

  function switchFloor(floor) {
    currentFloor = floor;
    document.getElementById("tab-B2").classList.toggle("active", floor === "지하 2층");
    document.getElementById("tab-B3").classList.toggle("active", floor === "지하 3층");
  }

  function openRegisterModal(zone) {
    currentZone = zone || "A";
    changeModalZone(currentZone);
    document.getElementById("inputPillar").value = "";
    currentBase64Photo = "";
    document.getElementById("modalPhotoPreview").style.display = "none";
    document.getElementById("cameraBtnLabel").classList.remove("has-photo");
    document.getElementById("cameraBtnText").innerText = "사진 촬영 또는 앨범에서 선택";
    document.getElementById("registerModal").style.display = "flex";
  }

  function closeModal() { document.getElementById("registerModal").style.display = "none"; }

  function changeModalZone(zone) {
    currentZone = zone;
    ["A", "B", "C"].forEach(z => {
      document.getElementById("btn-zone-" + z).classList.toggle("active", z === zone);
    });
    document.getElementById("modalZoneTitle").innerText = `${currentFloor} ${zone}구역 등록`;
  }

  function selectUser(user) {
    selectedUser = user;
    document.getElementById("user-btn-me").classList.toggle("active", user === "남편");
    document.getElementById("user-btn-wife").classList.toggle("active", user === "와이프");
  }

  function handlePhotoUpload(input) {
    if (!input.files || !input.files[0]) return;
    const file = input.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement("canvas");
        const MAX_WIDTH = 600;
        let width = img.width, height = img.height;
        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        currentBase64Photo = canvas.toDataURL("image/jpeg", 0.7);
        const preview = document.getElementById("modalPhotoPreview");
        preview.src = currentBase64Photo;
        preview.style.display = "block";
        document.getElementById("cameraBtnLabel").classList.add("has-photo");
        document.getElementById("cameraBtnText").innerText = "✅ 사진 첨부됨 (변경 가능)";
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function submitParkingData() {
    const pillarInput = document.getElementById("inputPillar").value.trim();
    if (!pillarInput) {
      alert("기둥/칸 번호를 입력해 주세요!");
      return;
    }
    const payload = {
      floor: currentFloor,
      zone: currentZone,
      pillar: pillarInput,
      updatedBy: selectedUser,
      photo: currentBase64Photo
    };
    saveToGas(payload);
  }

  function saveToGas(payload) {
    const btn = document.getElementById("saveSubmitBtn");
    if(btn) { btn.disabled = true; btn.innerText = "저장 중..."; }

    fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      closeModal();
      if(btn) { btn.disabled = false; btn.innerText = "주차 위치 저장하기"; }
      fetchParkingData();
    })
    .catch(() => {
      closeModal();
      if(btn) { btn.disabled = false; }
      fetchParkingData();
    });
  }

  function shareToKakao() {
    if (!currentPillar) {
      alert("등록된 주차 위치가 없습니다.");
      return;
    }
    const message = `[뽀띠찾기 110동]\n🚗 차 위치: ${currentFloor} ${currentZone}구역 [${currentPillar}]\n💡 출구: ${zoneExitGuides[currentZone]}\n📱 주차 앱 확인하기:\n${window.location.href}`;
    if (navigator.share) {
      navigator.share({ title: '주차 위치 공유', text: message }).catch(() => {});
    } else {
      navigator.clipboard.writeText(message).then(() => {
        alert("📋 카카오톡 공유 문구가 복사되었습니다! 카톡 대화방에 붙여넣어 주세요.");
      });
    }
  }
</script>
