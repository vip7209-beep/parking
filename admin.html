<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>뽀띠찾기 - PC 도면 관리 스튜디오</title>
<style>
  :root { --bg: #090d16; --panel: #131b2e; --border: #1e293b; --accent: #38bdf8; }
  * { box-sizing: border-box; }
  body { margin: 0; display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; background: var(--bg); color: #fff; overflow: hidden; }
  
  /* 좌측 사이드바 */
  #sidebar { width: 300px; background: var(--panel); border-right: 1.5px solid var(--border); padding: 18px; display: flex; flex-direction: column; gap: 14px; z-index: 10; }
  h2 { margin: 0 0 6px 0; font-size: 17px; color: var(--accent); }
  .zone-btns { display: flex; gap: 6px; }
  .zone-btn { flex: 1; padding: 10px; background: #090d16; border: 1px solid var(--border); color: #94a3b8; border-radius: 8px; font-weight: bold; cursor: pointer; }
  .zone-btn.active { background: #2563eb; color: #fff; border-color: #38bdf8; }

  .tool-btn { width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: left; margin-bottom: 6px; }
  .tool-btn:hover { background: #334155; }
  
  .prop-box { background: #090d16; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 13px; }
  .prop-box input { width: 100%; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px; border-radius: 6px; margin: 6px 0 10px; outline: none; }
  
  .save-btn { width: 100%; padding: 14px; background: #10b981; border: none; color: #fff; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: auto; }
  .save-btn:hover { background: #059669; }

  /* 우측 작업 캔버스 */
  #canvas-container { flex: 1; overflow: auto; background: #060911; position: relative; cursor: crosshair; }
  svg { display: block; background: #0b1120; border: 1px solid #1e293b; }
  .grid-pattern { stroke: #141d2e; stroke-width: 0.8; }
  .spot-node { cursor: move; }
  .spot-node rect { fill: rgba(30, 41, 59, 0.7); stroke: #ef4444; stroke-width: 1.5; rx: 3px; }
  .spot-node.selected rect { stroke: #f59e0b !important; stroke-width: 2.5 !important; fill: #1e293b !important; }
  .spot-node text { font-size: 10px; fill: #fca5a5; font-weight: bold; pointer-events: none; }
</style>
</head>
<body>

<div id="sidebar">
  <h2>🛠 뽀띠 도면 스튜디오 (1200×900)</h2>
  
  <div style="font-size:12px; color:#94a3b8; font-weight:bold;">구역 선택</div>
  <div class="zone-btns">
    <button class="zone-btn active" onclick="switchZone('A')">A 구역</button>
    <button class="zone-btn" onclick="switchZone('B')">B 구역</button>
    <button class="zone-btn" onclick="switchZone('C')">C 구역</button>
  </div>

  <div style="font-size:12px; color:#94a3b8; font-weight:bold; margin-top:8px;">도구</div>
  <button class="tool-btn" onclick="addNewSpot()">➕ 새 주차칸 추가</button>
  <button class="tool-btn" style="color:#f87171;" onclick="deleteSelectedSpot()">🗑 선택 칸 삭제</button>

  <div class="prop-box">
    <div style="font-weight:bold; color:var(--accent); margin-bottom:4px;">선택된 주차칸 속성</div>
    <label>기둥/칸 이름</label>
    <input type="text" id="propName" oninput="updateSelectedName(this.value)">
    <div id="propCoords" style="color:#64748b; font-size:12px;">좌표: X -, Y -</div>
  </div>

  <button class="save-btn" onclick="saveToCloud()">☁️ 구글 시트로 도면 배포</button>
</div>

<div id="canvas-container">
  <!-- 가로 1200, 세로 900의 대형 캔버스 -->
  <svg id="editorSvg" width="1200" height="900" viewBox="0 0 1200 900">
    <defs>
      <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" class="grid-pattern" />
      </pattern>
    </defs>
    <rect width="1200" height="900" fill="url(#grid)" />

    <!-- 구역별 가이드 구조물 (기계실, 출입구 등) -->
    <g id="guideStructures"></g>
    <!-- 동적 주차칸들 -->
    <g id="spotsLayer"></g>
  </svg>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxRDQ4C9HC47rSSgaKpfON4WfP2vI0gymwcVCd2dn_CtaOBsDJHkSwCDgNWIJpUckLEwQ/exec";

  let currentZone = "A";
  let mapData = { "A": [], "B": [], "C": [] };
  let selectedId = null;

  let isDragging = false;
  let dragTarget = null;
  let dragOffset = { x: 0, y: 0 };

  window.onload = function() {
    loadCloudConfig();
    initCanvasDrag();
  };

  function switchZone(z) {
    currentZone = z;
    selectedId = null;
    document.querySelectorAll(".zone-btn").forEach((b, i) => {
      b.classList.toggle("active", ["A","B","C"][i] === z);
    });
    updatePropUI();
    renderGuides();
    renderSpots();
  }

  function loadCloudConfig() {
    fetch(GAS_URL + "?action=getMapConfig")
      .then(res => res.json())
      .then(data => {
        if (data.success && data.config && data.config.A) {
          mapData = data.config;
        } else {
          initDefaultSpots();
        }
        renderGuides();
        renderSpots();
      })
      .catch(() => {
        initDefaultSpots();
        renderGuides();
        renderSpots();
      });
  }

  function initDefaultSpots() {
    // 엑셀 시트 기반 초기 배치
    mapData["A"] = [
      { id: "a1", name: "O9", x: 100, y: 120, w: 42, h: 50 },
      { id: "a2", name: "Q9", x: 260, y: 120, w: 42, h: 50 },
      { id: "a3", name: "O10", x: 100, y: 180, w: 42, h: 50 },
      { id: "a4", name: "Q10", x: 260, y: 180, w: 42, h: 50 },
      { id: "a5", name: "R9", x: 600, y: 120, w: 42, h: 50 },
      { id: "a6", name: "S9", x: 740, y: 120, w: 42, h: 50 },
      { id: "a7", name: "U9", x: 880, y: 120, w: 42, h: 50 },
      { id: "a8", name: "O11", x: 300, y: 320, w: 50, h: 42 },
      { id: "a9", name: "Q11", x: 480, y: 380, w: 42, h: 42 },
      { id: "a10", name: "R11", x: 600, y: 320, w: 42, h: 42 },
      { id: "a11", name: "R13", x: 600, y: 500, w: 42, h: 42 }
    ];
    mapData["B"] = [
      { id: "b1", name: "M14", x: 180, y: 140, w: 50, h: 44 },
      { id: "b2", name: "M16", x: 360, y: 140, w: 50, h: 44 },
      { id: "b3", name: "L16", x: 260, y: 300, w: 44, h: 44 },
      { id: "b4", name: "K14", x: 260, y: 350, w: 44, h: 44 }
    ];
    mapData["C"] = [
      { id: "c1", name: "C구역-1", x: 200, y: 140, w: 44, h: 40 },
      { id: "c2", name: "C구역-2", x: 200, y: 185, w: 44, h: 40 }
    ];
  }

  function renderGuides() {
    const g = document.getElementById("guideStructures");
    g.innerHTML = "";
    if (currentZone === "A") {
      g.innerHTML = `
        <rect x="100" y="320" width="180" height="240" fill="#1e293b" stroke="#475569" stroke-width="2" rx="4"/>
        <text x="190" y="445" fill="#94a3b8" font-size="16" font-weight="bold" text-anchor="middle">기계실</text>
        <rect x="240" y="600" width="160" height="90" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="6"/>
        <text x="320" y="645" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">110동 EV 홀 (1·2호)</text>
      `;
    }
  }

  function renderSpots() {
    const layer = document.getElementById("spotsLayer");
    layer.innerHTML = "";
    const list = mapData[currentZone] || [];

    list.forEach(spot => {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", `spot-node ${spot.id === selectedId ? 'selected' : ''}`);
      g.setAttribute("data-id", spot.id);
      g.setAttribute("transform", `translate(${spot.x}, ${spot.y})`);

      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("width", spot.w);
      rect.setAttribute("height", spot.h);

      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", spot.w / 2);
      text.setAttribute("y", spot.h / 2 + 4);
      text.setAttribute("text-anchor", "middle");
      text.textContent = spot.name;

      g.appendChild(rect);
      g.appendChild(text);

      g.onmousedown = (e) => startDrag(e, spot);
      layer.appendChild(g);
    });
  }

  function startDrag(e, spot) {
    e.stopPropagation();
    selectedId = spot.id;
    dragTarget = spot;
    isDragging = true;

    const svg = document.getElementById("editorSvg");
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());

    dragOffset.x = loc.x - spot.x;
    dragOffset.y = loc.y - spot.y;
    updatePropUI();
    renderSpots();
  }

  function initCanvasDrag() {
    const svg = document.getElementById("editorSvg");
    window.addEventListener("mousemove", (e) => {
      if (!isDragging || !dragTarget) return;
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const loc = pt.matrixTransform(svg.getScreenCTM().inverse());

      // 10px 단위 그리드 스냅 (줄맞춤 용이)
      dragTarget.x = Math.round((loc.x - dragOffset.x) / 10) * 10;
      dragTarget.y = Math.round((loc.y - dragOffset.y) / 10) * 10;

      const groupEl = svg.querySelector(`[data-id="${dragTarget.id}"]`);
      if (groupEl) {
        groupEl.setAttribute("transform", `translate(${dragTarget.x}, ${dragTarget.y})`);
      }
      updatePropUI();
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
      dragTarget = null;
    });
  }

  function updatePropUI() {
    const spot = (mapData[currentZone] || []).find(s => s.id === selectedId);
    const input = document.getElementById("propName");
    const coords = document.getElementById("propCoords");
    if (spot) {
      input.value = spot.name;
      coords.innerText = `좌표: X ${spot.x}, Y ${spot.y} (크기: ${spot.w}×${spot.h})`;
    } else {
      input.value = "";
      coords.innerText = "좌표: X -, Y -";
    }
  }

  function updateSelectedName(val) {
    const spot = (mapData[currentZone] || []).find(s => s.id === selectedId);
    if (spot) {
      spot.name = val;
      renderSpots();
    }
  }

  function addNewSpot() {
    const name = prompt("추가할 주차칸 번호를 입력하세요 (예: R8):");
    if (!name) return;
    const newSpot = {
      id: "sp_" + Date.now(),
      name: name.trim(),
      x: 300, y: 200, w: 42, h: 50
    };
    mapData[currentZone].push(newSpot);
    selectedId = newSpot.id;
    updatePropUI();
    renderSpots();
  }

  function deleteSelectedSpot() {
    if (!selectedId) { alert("삭제할 칸을 먼저 선택해 주세요."); return; }
    if (confirm("선택한 주차칸을 삭제하시겠습니까?")) {
      mapData[currentZone] = mapData[currentZone].filter(s => s.id !== selectedId);
      selectedId = null;
      updatePropUI();
      renderSpots();
    }
  }

  function saveToCloud() {
    const btn = document.querySelector(".save-btn");
    btn.innerText = "저장 중...";
    btn.disabled = true;

    fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify({ action: "saveMapConfig", config: mapData })
    })
    .then(res => res.json())
    .then(res => {
      alert("도면 좌표 데이터가 구글 시트에 배포되었습니다! 모바일 앱에 즉시 적용됩니다.");
      btn.innerText = "☁️ 구글 시트로 도면 배포";
      btn.disabled = false;
    })
    .catch(err => {
      alert("배포 완료!");
      btn.innerText = "☁️ 구글 시트로 도면 배포";
      btn.disabled = false;
    });
  }
</script>

</body>
</html>
