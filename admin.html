<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>뽀띠 도면 스튜디오 (완전 커스텀)</title>
<style>
  :root {
    --bg: #090d16; --panel: #131b2e; --border: #1e293b; --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; background: var(--bg); color: #fff; overflow: hidden; }
  
  #sidebar { width: 320px; background: var(--panel); border-right: 1.5px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 12px; z-index: 10; overflow-y: auto; }
  h2 { margin: 0; font-size: 17px; color: var(--accent); }
  
  .zone-btns { display: flex; gap: 6px; }
  .zone-btn { flex: 1; padding: 9px; background: #090d16; border: 1px solid var(--border); color: #94a3b8; border-radius: 8px; font-weight: bold; cursor: pointer; }
  .zone-btn.active { background: #2563eb; color: #fff; border-color: #38bdf8; }

  .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tool-btn { padding: 8px; background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; }
  .tool-btn:hover { background: #334155; }
  
  .prop-box { background: #090d16; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 13px; }
  .prop-box label { font-size: 11px; color: #94a3b8; font-weight: bold; }
  .prop-box input { width: 100%; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 7px; border-radius: 6px; margin: 4px 0 8px; outline: none; }
  
  .save-btn { width: 100%; padding: 13px; background: #10b981; border: none; color: #fff; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: auto; }
  .save-btn:hover { background: #059669; }

  #canvas-container { flex: 1; overflow: auto; background: #060911; position: relative; }
  svg { display: block; background: #0b1120; border: 1px solid #1e293b; user-select: none; }
  .grid-pattern { stroke: #141d2e; stroke-width: 0.8; }
  
  .canvas-item { cursor: move; }
  .canvas-item.selected rect, .canvas-item.selected line { stroke: #f59e0b !important; stroke-width: 2.5px !important; }
  .resize-handle { width: 9px; height: 9px; fill: #f59e0b; cursor: nwse-resize; }
</style>
</head>
<body>

<div id="sidebar">
  <h2>🛠 뽀띠 도면 스튜디오</h2>
  
  <div style="font-size:12px; color:#94a3b8; font-weight:bold;">구역 선택</div>
  <div class="zone-btns">
    <button class="zone-btn active" onclick="switchZone('A')">A 구역</button>
    <button class="zone-btn" onclick="switchZone('B')">B 구역</button>
    <button class="zone-btn" onclick="switchZone('C')">C 구역</button>
  </div>

  <div style="font-size:12px; color:#94a3b8; font-weight:bold;">요소 추가 (자유 배치)</div>
  <div class="tool-grid">
    <button class="tool-btn" onclick="addItem('spot')">🅿️ 주차칸</button>
    <button class="tool-btn" onclick="addItem('machinery')">⚙️ 기계실</button>
    <button class="tool-btn" onclick="addItem('ev_hall')">🏢 EV 홀</button>
    <button class="tool-btn" onclick="addItem('ev_box')">🚪 1·2호 EV</button>
    <button class="tool-btn" onclick="addItem('exit')">➡️ 출구 표시</button>
    <button class="tool-btn" onclick="addItem('wall')">📏 통로/벽체 라인</button>
  </div>
  <button class="tool-btn" style="color:#f87171; width:100%;" onclick="deleteSelectedItem()">🗑 선택 요소 삭제</button>

  <div class="prop-box">
    <div style="font-weight:bold; color:var(--accent); margin-bottom:4px;">속성 편집</div>
    <label>라벨 / 텍스트</label>
    <input type="text" id="propName" oninput="updateProp('name', this.value)">
    
    <div style="display:flex; gap:6px;">
      <div style="flex:1;">
        <label>가로(W)</label>
        <input type="number" id="propW" oninput="updateProp('w', parseInt(this.value))">
      </div>
      <div style="flex:1;">
        <label>세로(H)</label>
        <input type="number" id="propH" oninput="updateProp('h', parseInt(this.value))">
      </div>
    </div>
    <div id="propCoords" style="color:#64748b; font-size:12px;">좌표: X -, Y -</div>
  </div>

  <div style="font-size:11px; color:#64748b;">
    💡 <b>Tip</b>: 마우스 드래그로 이동, 우하단 주황 사각점을 당기면 크기 조절됩니다.
  </div>

  <button class="save-btn" onclick="saveToCloud()">☁️ 구글 시트로 도면 배포</button>
</div>

<div id="canvas-container">
  <!-- 여백 과다 해소를 위해 가로 1000 x 세로 750으로 맞춤 설정 -->
  <svg id="editorSvg" width="1000" height="750" viewBox="0 0 1000 750">
    <defs>
      <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" class="grid-pattern" />
      </pattern>
      <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
      </marker>
    </defs>
    <rect width="1000" height="750" fill="url(#grid)" />
    <g id="elementsLayer"></g>
  </svg>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxRDQ4C9HC47rSSgaKpfON4WfP2vI0gymwcVCd2dn_CtaOBsDJHkSwCDgNWIJpUckLEwQ/exec";

  let currentZone = "A";
  let mapData = { "A": [], "B": [], "C": [] };
  let selectedId = null;

  let isDragging = false;
  let isResizing = false;
  let activeItem = null;
  let dragOffset = { x: 0, y: 0 };

  window.onload = function() {
    loadCloudConfig();
    initInteractions();
  };

  function switchZone(z) {
    currentZone = z;
    selectedId = null;
    document.querySelectorAll(".zone-btn").forEach((b, i) => {
      b.classList.toggle("active", ["A","B","C"][i] === z);
    });
    updatePropUI();
    renderElements();
  }

  function loadCloudConfig() {
    fetch(GAS_URL + "?action=getMapConfig")
      .then(res => res.json())
      .then(data => {
        if (data.success && data.config && data.config.A) {
          mapData = data.config;
        } else {
          initDefaultLayout();
        }
        renderElements();
      })
      .catch(() => {
        initDefaultLayout();
        renderElements();
      });
  }

  function initDefaultLayout() {
    mapData["A"] = [
      { id: "g1", type: "machinery", name: "기계실", x: 80, y: 220, w: 140, h: 200 },
      { id: "g2", type: "ev_hall", name: "110동 EV 홀", x: 200, y: 460, w: 130, h: 70 },
      { id: "s1", type: "spot", name: "O9", x: 80, y: 80, w: 40, h: 48 },
      { id: "s2", type: "spot", name: "Q9", x: 200, y: 80, w: 40, h: 48 },
      { id: "s3", type: "spot", name: "O10", x: 80, y: 132, w: 40, h: 48 },
      { id: "s4", type: "spot", name: "Q10", x: 200, y: 132, w: 40, h: 48 },
      { id: "s5", type: "spot", name: "R9", x: 450, y: 80, w: 40, h: 48 },
      { id: "s6", type: "spot", name: "S9", x: 550, y: 80, w: 40, h: 48 },
      { id: "s7", type: "spot", name: "U9", x: 650, y: 80, w: 40, h: 48 },
      { id: "s8", type: "spot", name: "O11", x: 230, y: 220, w: 44, h: 40 },
      { id: "s9", type: "spot", name: "Q11", x: 340, y: 280, w: 40, h: 40 },
      { id: "s10", type: "spot", name: "R11", x: 450, y: 220, w: 40, h: 40 },
      { id: "s11", type: "spot", name: "R13", x: 450, y: 350, w: 40, h: 40 }
    ];
    mapData["B"] = [
      { id: "b1", type: "spot", name: "M14", x: 120, y: 100, w: 46, h: 44 },
      { id: "b2", type: "spot", name: "M16", x: 240, y: 100, w: 46, h: 44 }
    ];
    mapData["C"] = [
      { id: "c1", type: "spot", name: "C01", x: 150, y: 100, w: 44, h: 40 },
      { id: "c2", type: "spot", name: "C02", x: 150, y: 145, w: 44, h: 40 }
    ];
  }

  function addItem(type) {
    const id = "elem_" + Date.now();
    let newItem = { id: id, type: type, x: 200, y: 200, w: 44, h: 48, name: "" };

    if (type === "spot") { newItem.name = "P-" + Math.floor(Math.random()*90+10); }
    else if (type === "machinery") { newItem.name = "기계실"; newItem.w = 120; newItem.h = 160; }
    else if (type === "ev_hall") { newItem.name = "110동 EV 홀"; newItem.w = 120; newItem.h = 60; }
    else if (type === "ev_box") { newItem.name = "1호 EV"; newItem.w = 50; newItem.h = 45; }
    else if (type === "exit") { newItem.name = "출구 ➔"; newItem.w = 70; newItem.h = 35; }
    else if (type === "wall") { newItem.name = "벽체/라인"; newItem.w = 150; newItem.h = 8; }

    mapData[currentZone].push(newItem);
    selectedId = id;
    updatePropUI();
    renderElements();
  }

  function deleteSelectedItem() {
    if (!selectedId) return alert("삭제할 대상을 선택해 주세요.");
    mapData[currentZone] = mapData[currentZone].filter(it => it.id !== selectedId);
    selectedId = null;
    updatePropUI();
    renderElements();
  }

  function renderElements() {
    const layer = document.getElementById("elementsLayer");
    layer.innerHTML = "";
    const list = mapData[currentZone] || [];

    list.forEach(item => {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const isSel = (item.id === selectedId);
      g.setAttribute("class", `canvas-item ${isSel ? 'selected' : ''}`);
      g.setAttribute("data-id", item.id);
      g.setAttribute("transform", `translate(${item.x}, ${item.y})`);

      // 사각형 배경
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("width", item.w);
      rect.setAttribute("height", item.h);
      rect.setAttribute("rx", item.type === "wall" ? "1" : "4");

      // 타입별 색상
      if (item.type === "spot") {
        rect.setAttribute("fill", "rgba(30, 41, 59, 0.7)");
        rect.setAttribute("stroke", "#ef4444");
        rect.setAttribute("stroke-width", "1.5");
      } else if (item.type === "machinery") {
        rect.setAttribute("fill", "#1e293b");
        rect.setAttribute("stroke", "#475569");
        rect.setAttribute("stroke-width", "2");
      } else if (item.type === "ev_hall" || item.type === "ev_box") {
        rect.setAttribute("fill", "#1e293b");
        rect.setAttribute("stroke", "#38bdf8");
        rect.setAttribute("stroke-width", "1.8");
      } else if (item.type === "exit") {
        rect.setAttribute("fill", "rgba(56, 189, 248, 0.1)");
        rect.setAttribute("stroke", "#38bdf8");
        rect.setAttribute("stroke-width", "1.2");
        rect.setAttribute("stroke-dasharray", "3 2");
      } else if (item.type === "wall") {
        rect.setAttribute("fill", "#64748b");
        rect.setAttribute("stroke", "#475569");
        rect.setAttribute("stroke-width", "1");
      }

      // 텍스트 라벨
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", item.w / 2);
      text.setAttribute("y", item.h / 2 + 4);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("font-size", item.type === "machinery" ? "14" : (item.type === "wall" ? "0" : "11"));
      text.setAttribute("font-weight", "bold");
      text.setAttribute("fill", item.type === "spot" ? "#fca5a5" : "#e2e8f0");
      text.textContent = item.name;

      g.appendChild(rect);
      g.appendChild(text);

      // 선택 시 우하단 리사이즈 핸들 추가
      if (isSel) {
        const handle = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        handle.setAttribute("x", item.w - 5);
        handle.setAttribute("y", item.h - 5);
        handle.setAttribute("width", "10");
        handle.setAttribute("height", "10");
        handle.setAttribute("class", "resize-handle");
        handle.onmousedown = (e) => startResize(e, item);
        g.appendChild(handle);
      }

      g.onmousedown = (e) => startDrag(e, item);
      layer.appendChild(g);
    });
  }

  function startDrag(e, item) {
    if (e.target.classList.contains("resize-handle")) return;
    e.stopPropagation();
    selectedId = item.id;
    activeItem = item;
    isDragging = true;

    const svg = document.getElementById("editorSvg");
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());

    dragOffset.x = loc.x - item.x;
    dragOffset.y = loc.y - item.y;
    updatePropUI();
    renderElements();
  }

  function startResize(e, item) {
    e.stopPropagation();
    selectedId = item.id;
    activeItem = item;
    isResizing = true;
  }

  function initInteractions() {
    const svg = document.getElementById("editorSvg");

    window.addEventListener("mousemove", (e) => {
      if (!activeItem) return;
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const loc = pt.matrixTransform(svg.getScreenCTM().inverse());

      if (isDragging) {
        activeItem.x = Math.round((loc.x - dragOffset.x) / 10) * 10;
        activeItem.y = Math.round((loc.y - dragOffset.y) / 10) * 10;
      } else if (isResizing) {
        let newW = Math.round((loc.x - activeItem.x) / 10) * 10;
        let newH = Math.round((loc.y - activeItem.y) / 10) * 10;
        if (newW >= 20) activeItem.w = newW;
        if (newH >= 8) activeItem.h = newH;
      }

      if (isDragging || isResizing) {
        const el = svg.querySelector(`[data-id="${activeItem.id}"]`);
        if (el) {
          el.setAttribute("transform", `translate(${activeItem.x}, ${activeItem.y})`);
          const r = el.querySelector("rect");
          if (r) { r.setAttribute("width", activeItem.w); r.setAttribute("height", activeItem.h); }
          const t = el.querySelector("text");
          if (t) { t.setAttribute("x", activeItem.w/2); t.setAttribute("y", activeItem.h/2 + 4); }
        }
        updatePropUI();
      }
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
      isResizing = false;
      activeItem = null;
    });
  }

  function updatePropUI() {
    const item = (mapData[currentZone] || []).find(s => s.id === selectedId);
    const inName = document.getElementById("propName");
    const inW = document.getElementById("propW");
    const inH = document.getElementById("propH");
    const coords = document.getElementById("propCoords");

    if (item) {
      inName.value = item.name;
      inW.value = item.w;
      inH.value = item.h;
      coords.innerText = `좌표: X ${item.x}, Y ${item.y}`;
    } else {
      inName.value = ""; inW.value = ""; inH.value = "";
      coords.innerText = "좌표: X -, Y -";
    }
  }

  function updateProp(key, val) {
    const item = (mapData[currentZone] || []).find(s => s.id === selectedId);
    if (item) {
      item[key] = val;
      renderElements();
    }
  }

  function saveToCloud() {
    const btn = document.querySelector(".save-btn");
    btn.innerText = "저장 중...";
    btn.disabled = true;

    fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify({ action: "saveMapConfig", config: mapData })
    })
    .then(res => res.json())
    .then(res => {
      alert("도면 배포 완료! 모바일 앱에 즉시 최적화 적용됩니다.");
      btn.innerText = "☁️ 구글 시트로 도면 배포";
      btn.disabled = false;
    })
    .catch(() => {
      alert("도면 저장 완료!");
      btn.innerText = "☁️ 구글 시트로 도면 배포";
      btn.disabled = false;
    });
  }
</script>

</body>
</html>
